# Benchmark manifest: parts, splits, tolerance sources.
# Spec: docs/superpowers/specs/2026-09-28-placement-benchmark-design.md (sub-project C).
#
# THE SPLIT IS FIXED HERE and changes only through a reviewed PR (PRD C4).
# Prompts, the IR and the planner may be tuned on `dev` parts only. A `held_out`
# part must never be used for tuning, debugging or prompt examples.

version: 1
split_decided: "2026-10-04"
split_decided_by: "ggould (MalteseWarrior)"
split_rationale: >
  The 5 ViewDefinedDrawings parts were originally proposed as held-out, but on
  2026-10-04 they were used to diagnose and fix the pipeline (STATE.md 3.0, error
  log E011-E017). The 4 macro parts were hand-patched in June (E009-E010). All 9 are
  therefore DEV. Held-out parts must be drawings no one has worked on, with an MTI
  reference STEP, chosen and frozen here BEFORE any IR/prompt tuning starts on them.

tolerance_default: >
  Dimension tolerance when printed; otherwise the title-block general tolerance;
  otherwise +-0.005 in / +-0.1 mm (PRD open question, proposed).

mti_bench:
  spec: docs/superpowers/specs/2026-10-23-benchmark-dataset-design.md
  delivered: "2026-10-11"
  split_decided: "2026-10-23"
  split_decided_by: "smcanuff (with Claude)"
  seed: 20261023
  rule: >
    14 clean drawing-model pairs. Format dev = random.Random(20261023).sample of the 9 simple
    parts excluding the near-duplicate pair A050471E/A050481E (bench/split.py). The other 11,
    including all 3 complex parts, are held-out. Files live outside git under MTI_BENCH_DATA/<part>/.

splits:
  dev:
    - part: A040911E
      family: flanged bearing (counterbored bolt circle, cropped 2-hole callout)
      views: data/inputs/view_defined_drawings/A040911E-20260618T093212Z-3-001/A040911E
      units: inch
      reference_step: null      # MTI to supply
    - part: A040921E
      family: spacer ring with end slot
      views: data/inputs/view_defined_drawings/A040921E-20260618T093224Z-3-001/A040921E
      units: inch
      reference_step: null
    - part: SB11033
      family: flange + stacked boss + bolt circle + edge breaks
      views: data/inputs/view_defined_drawings/SB11033-20260618T093243Z-3-001/SB11033
      units: inch
      reference_step: null
    - part: SB11780
      family: turned tie rod (necks, keyway, journals)
      views: data/inputs/view_defined_drawings/SB11780-20260618T093317Z-3-001/SB11780
      units: inch
      reference_step: null
    - part: SB11842
      family: spindle back-up flange (counterbored bolt circle)
      views: data/inputs/view_defined_drawings/SB11842-20260618T093328Z-3-001/SB11842
      units: inch
      reference_step: null
    - part: 115-C
      family: plate (check bypass)
      views: data/inputs/drawing_pdfs/A001171E.PDF
      units: inch
      reference_step: null
    - part: 116-C
      family: plate, 2x2 grid (check valve eliminator)
      views: data/inputs/drawing_pdfs/A001151E.PDF
      units: inch
      reference_step: null
    - part: 117-C
      family: plate, 14-hole callout (check valve adaptor)
      views: data/inputs/drawing_pdfs/A001131E.PDF
      units: inch
      reference_step: null
    - part: 135-A
      family: key
      views: data/inputs/drawing_pdfs/A001351E.PDF
      units: inch
      reference_step: null
    - {part: A050381E, source: mti_bench, family: "mounting pad block, 4 tapped blind", units: inch, complexity: simple, reference_step: reference.step}
    - {part: A050511E, source: mti_bench, family: "key (Wuxi), counterbore", units: inch, complexity: simple, reference_step: reference.step}
    # re-admitted 2026-10-24 (drawing-is-ground-truth policy); twin of format-dev A050381E
    - {part: A050381M, source: mti_bench, family: "mounting pad, metric taps (twin of A050381E)", units: inch, complexity: simple, reference_step: reference.step, readmitted: "2026-10-24"}
    # swapped in 2026-10-24 (seed 20261024): format dev had no turned-part features (bench/split.py swap_pick)
    - {part: A050311E, source: mti_bench, family: "collet actuator ring", units: inch, complexity: simple, reference_step: reference.step, swapped: "2026-10-24"}

  # FROZEN 2026-10-23 (spec 2026-10-23). Never tune, debug or take prompt examples from these.
  held_out:
    - {part: A050071E, source: mti_bench, family: "rod with flat, tapped ends", units: inch, complexity: simple, reference_step: reference.step}
    - {part: A050181E, source: mti_bench, family: "mounting pad bar, 2 tapped thru", units: inch, complexity: simple, reference_step: reference.step}
    - {part: A050211E, source: mti_bench, family: "retainer disc, 6 thru holes, U-notch", units: inch, complexity: simple, reference_step: reference.step}
    - {part: A050221E, source: mti_bench, family: "flanged disc, bore, hole pattern", units: inch, complexity: simple, reference_step: reference.step}
