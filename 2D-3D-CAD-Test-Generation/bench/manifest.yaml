    - {part: A050031E, source: mti_bench, family: "adapter (sheet stamped OBSOLETE)", units: inch, complexity: simple, reference_step: reference.step, readmitted: "2026-10-24"}
    - {part: A050061E, source: mti_bench, family: "bushing (sheet stamped OBSOLETE)", units: inch, complexity: simple, reference_step: reference.step, readmitted: "2026-10-24"}
    - {part: A050081E_OLD, source: mti_bench, family: "wear plate (sheet stamped OBSOLETE)", units: inch, complexity: simple, reference_step: reference.step, readmitted: "2026-10-24"}
    - {part: A050131M, source: mti_bench, family: "key (sheet stamped OBSOLETE)", units: inch, complexity: simple, reference_step: reference.step, readmitted: "2026-10-24"}
  parked:
    - {part: 1807408E, source: mti_bench, reason: "pairing rejected at key review: model differs from drawing (parked 2026-10-24)"}
    - {part: 1801901E, source: mti_bench, reason: "multi-body model (4 solids); cannot be keyed as one part (parked 2026-10-24)"}
