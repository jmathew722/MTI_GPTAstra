<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 72" role="img" aria-label="Solid Flow">
  <title>Solid Flow</title>
  <defs>
    <linearGradient id="sfArrow" x1="22" y1="40" x2="52" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9B8AFB"/>
      <stop offset="1" stop-color="#D6AF6B"/>
    </linearGradient>
    <linearGradient id="sfCubeTop" x1="38" y1="36" x2="58" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAC783"/>
      <stop offset="1" stop-color="#D6AF6B"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="0" y="4" width="64" height="64" rx="14" fill="#191B20" stroke="#30323A" stroke-width="1.5"/>

  <!-- 2D drawing corner: a dimensioned L-corner with one hole, representing the source drawing -->
  <g fill="none" stroke="#F2F2F4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 16 V32 H27"/>
    <path d="M13 12 V15" stroke-width="1.1"/>
    <path d="M27 32 H30" stroke-width="1.1"/>
    <circle cx="20" cy="24" r="3.1" stroke-width="1.3"/>
  </g>

  <!-- Arrow: drawing becomes the model -->
  <path d="M24 38 C 30 44, 40 40, 47 33" fill="none" stroke="url(#sfArrow)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M43.5 29.5 L49 32 L45.5 37" fill="none" stroke="url(#sfArrow)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3D part: a simple isometric block -->
  <g stroke="#15110A" stroke-width="0.6" stroke-linejoin="round">
    <path d="M41 46 L51 40 L59 44 L49 50 Z" fill="url(#sfCubeTop)"/>
    <path d="M41 46 L49 50 L49 59 L41 55 Z" fill="#C79A5A"/>
    <path d="M49 50 L59 44 L59 53 L49 59 Z" fill="#A87F43"/>
  </g>

  <!-- Wordmark -->
  <text x="76" y="46" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-0.4">
    <tspan fill="#F2F2F4">Solid</tspan><tspan fill="#D6AF6B">Flow</tspan>
  </text>
</svg>
